<!-- tubeReader app mark: a play triangle over lines of prose — video in,
     text out. Kept to two heavy shapes so it still reads at 72px on a phone
     home screen. Source for the PNGs beside it; regenerate with
     ./scripts/make-icons.sh after editing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0a0a0a"/>
  <g fill="#fafafa">
    <!-- Play triangle. Drawn as a stroked polygon so the corners round off
         without any arc math; stroke-width is half the corner radius. -->
    <path d="M205 106 L205 246 L327 176 Z"
          stroke="#fafafa" stroke-width="34" stroke-linejoin="round"/>
    <!-- Caption lines. The last is dimmed so the block reads as text that
         continues past the frame rather than a solid slab. -->
    <rect x="116" y="292" width="280" height="30" rx="15"/>
    <rect x="116" y="344" width="280" height="30" rx="15"/>
    <rect x="116" y="396" width="176" height="30" rx="15" fill-opacity="0.45"/>
  </g>
</svg>
